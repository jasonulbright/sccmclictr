name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  CLIENTCENTER_SIGN_ENDPOINT: https://eus.codesigning.azure.net
  CLIENTCENTER_SIGN_ACCOUNT: signalridgelabs
  CLIENTCENTER_SIGN_PROFILE: SRL-Public
  CLIENTCENTER_SIGN_SUBJECT_CN: Jason Ulbright

jobs:
  release:
    name: Build, sign, and publish
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH[.REVISION]; got '${{ github.ref_name }}'."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Run maintenance checks
        shell: powershell
        run: .\tools\test-maintenance.ps1

      - name: Build application and all plugins
        shell: powershell
        run: .\scripts\build.ps1 -Configuration Release -Version $env:RELEASE_VERSION -OutputDirectory artifacts\stage

      - name: Run unit tests
        shell: powershell
        run: .\scripts\test.ps1 -Configuration Release

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PowerShell validation tests
        shell: powershell
        run: .\scripts\test-pester.ps1

      - name: Azure login for Artifact Signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign application binaries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.CLIENTCENTER_SIGN_ENDPOINT }}
          signing-account-name: ${{ env.CLIENTCENTER_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.CLIENTCENTER_SIGN_PROFILE }}
          files: |
            ${{ github.workspace }}\artifacts\stage\SCCMCliCtrWPF.exe
            ${{ github.workspace }}\artifacts\stage\Customization.dll
            ${{ github.workspace }}\artifacts\stage\sccmclictr.automation.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_AMTTools.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_AppV46.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_CMRemote.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_CMResourceExplorer.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_CompMgmt.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_EnablePSRemoting.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_Explorer.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_FEP.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_MSInfo32.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_MSRA.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_PSScripts.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_RDP.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_Regedit.dll
            ${{ github.workspace }}\artifacts\stage\Plugin_StatusMessageViewer.dll
          timestamp-digest: SHA256

      - name: Verify application signatures
        shell: powershell
        run: .\scripts\verify-signatures.ps1 -Path artifacts\stage -ExpectedSubjectCommonName $env:CLIENTCENTER_SIGN_SUBJECT_CN

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Create portable archive and installer
        shell: powershell
        run: .\scripts\new-release-assets.ps1 -StageDirectory artifacts\stage -Version $env:RELEASE_VERSION -OutputDirectory artifacts\release

      - name: Authenticode-sign installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.CLIENTCENTER_SIGN_ENDPOINT }}
          signing-account-name: ${{ env.CLIENTCENTER_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ env.CLIENTCENTER_SIGN_PROFILE }}
          files: ${{ github.workspace }}\artifacts\release\ClientCenterForConfigMgr-Setup.exe
          timestamp-digest: SHA256

      - name: Verify installer signature
        shell: powershell
        run: .\scripts\verify-signatures.ps1 -Path artifacts\release\ClientCenterForConfigMgr-Setup.exe -ExpectedSubjectCommonName $env:CLIENTCENTER_SIGN_SUBJECT_CN

      - name: Generate checksums
        shell: powershell
        run: .\scripts\new-checksums.ps1 -Directory artifacts\release

      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: artifacts/release/*

      - name: Create verified draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts\release -File | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' @assets --draft --verify-tag --title "Client Center for Configuration Manager ${{ github.ref_name }}" --generate-notes

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit '${{ github.ref_name }}' --draft=false --latest
